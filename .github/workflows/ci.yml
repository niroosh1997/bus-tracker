name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to a PR makes the first run irrelevant; don't pay for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Follows .nvmrc, so CI and local development cannot drift apart.
          # The version matters here: the server and tests are TypeScript run
          # directly by node, which needs 22.6+ for native type stripping.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
