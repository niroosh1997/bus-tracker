<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bus Tracker — find a line</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --border:#e2e5ea; --text:#1a1d21; --muted:#6b7280; --accent:#2563eb; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--text); }
  main { max-width:760px; margin:0 auto; padding:32px 20px 64px; }
  h1 { font-size:24px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 24px; font-size:15px; }
  form { display:flex; gap:8px; margin-bottom:20px; }
  input { flex:1; padding:12px 14px; font-size:17px; border:1px solid var(--border); border-radius:10px; }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  button { padding:12px 22px; font-size:16px; font-weight:600; border:0; border-radius:10px;
           background:var(--accent); color:#fff; cursor:pointer; }
  button:hover { background:#1d4ed8; }
  .note { font-size:13px; color:var(--muted); margin:0 0 16px; }
  .err { background:#fef2f2; color:#991b1b; padding:10px 14px; border-radius:8px; font-size:14px; }
  ul { list-style:none; margin:0; padding:0; }
  li { background:var(--panel); border:1px solid var(--border); border-radius:10px;
       padding:14px 16px; margin-bottom:10px; cursor:pointer; }
  li:hover { border-color:var(--accent); }
  li[aria-selected="true"] { border-color:var(--accent); background:#eef2ff; }
  .row { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .num { font-weight:700; font-size:18px; }
  .company { color:var(--muted); font-size:14px; }
  .ends { margin-top:8px; display:grid; grid-template-columns:auto 1fr; gap:2px 10px;
          align-items:baseline; line-height:1.5; }
  .label { color:var(--muted); font-size:12px; text-transform:uppercase;
           letter-spacing:.04em; }
  .id { margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); font-size:14px; }
  .id code { background:#f1f3f5; padding:2px 8px; border-radius:5px; font-size:15px; font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>Find a bus line</h1>
  <p class="sub">Type the number painted on the bus. One number can belong to several
     different routes and companies — pick the one you mean.</p>

  <form id="search">
    <input id="number" inputmode="numeric" placeholder="Line number, e.g. 56" aria-label="Line number" />
    <button type="submit">Search</button>
  </form>

  <p class="note" id="note"></p>
  <ul id="results"></ul>
</main>

<script type="module">
const form = document.getElementById('search');
const input = document.getElementById('number');
const note = document.getElementById('note');
const results = document.getElementById('results');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const number = input.value.trim();
  if (!number) return;

  results.innerHTML = '';
  note.className = 'note';
  note.textContent = 'Searching…';

  try {
    const res = await fetch(`/api/lines/${encodeURIComponent(number)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
    render(data);
  } catch (err) {
    note.className = 'err';
    note.textContent = err.message;
  }
});

function render({ number, date, routes }) {
  if (!routes.length) {
    note.textContent = `No route uses the number ${number}.`;
    return;
  }
  note.textContent =
    `${routes.length} route${routes.length === 1 ? '' : 's'} use the number ${number}` +
    ` · schedule of ${date}`;

  for (const r of routes) {
    const li = document.createElement('li');
    li.innerHTML = `
      <div class="row">
        <span class="num">${r.number}</span>
        <span class="company" dir="auto">${r.company ?? 'unknown company'}</span>
      </div>
      <div class="ends">
        <span class="label">from</span><bdi>${r.start ?? '?'}</bdi>
        <span class="label">to</span><bdi>${r.end ?? '?'}</bdi>
      </div>`;

    li.addEventListener('click', () => {
      for (const other of results.children) {
        other.removeAttribute('aria-selected');
        other.querySelector('.id')?.remove();
      }
      li.setAttribute('aria-selected', 'true');
      const id = document.createElement('div');
      id.className = 'id';
      id.innerHTML = `API line id: <code>${r.lineRef}</code>`;
      li.append(id);
    });

    results.append(li);
  }
}
</script>
</body>
</html>
